name: Release

# Publishing a GitHub release builds the package and uploads it to PyPI.
# No token is stored anywhere: PyPI trusts this workflow in this repository
# (trusted publishing), and checks that on every upload.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
