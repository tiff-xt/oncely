[project]
name = "onceonly"
version = "0.1.0"
description = "Idempotency keys and a transactional outbox for async SQLAlchemy and Postgres."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["idempotency", "outbox", "sqlalchemy", "postgres", "redis", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["sqlalchemy[asyncio]>=2.0.36"]

[project.urls]
Homepage = "https://github.com/tiff-xt/onceonly"
Issues = "https://github.com/tiff-xt/onceonly/issues"

[project.optional-dependencies]
# The outbox publishes through any async function. This extra adds the
# ready-made Redis Streams publisher and consumer.
redis = ["redis>=5.2"]

[dependency-groups]
dev = [
    "asyncpg>=0.30",
    "redis>=5.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onceonly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "PT", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
